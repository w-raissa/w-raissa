<g stroke="#2D6A4F" stroke-width="0.8" opacity="0.5">
  <line x1="82" y1="44" x2="128" y2="20"><animate attributeName="opacity" values="0;0.5;0" dur="4s" begin="0s" repeatCount="indefinite"/></line>
  <line x1="128" y1="52" x2="174" y2="44"><animate attributeName="opacity" values="0;0.5;0" dur="3.5s" begin="0.8s" repeatCount="indefinite"/></line>
  <line x1="174" y1="92" x2="220" y2="92"><animate attributeName="opacity" values="0;0.5;0" dur="4.2s" begin="1.2s" repeatCount="indefinite"/></line>
  <line x1="55" y1="140" x2="101" y2="164"><animate attributeName="opacity" values="0;0.5;0" dur="3.8s" begin="0.4s" repeatCount="indefinite"/></line>
  <line x1="220" y1="140" x2="266" y2="116"><animate attributeName="opacity" values="0;0.5;0" dur="4.5s" begin="1s" repeatCount="indefinite"/></line>
</g>

<!-- Right side - subtle constellation dots -->
<g fill="#2D6A4F">
  <circle cx="780" cy="40" r="1.5"><animate attributeName="opacity" values="0.1;0.6;0.1" dur="4s" begin="0.5s" repeatCount="indefinite"/></circle>
