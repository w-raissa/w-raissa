<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0C1A10"/>
    <stop offset="100%" stop-color="#1A3028"/>
  </linearGradient>
  <linearGradient id="gl" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#1A4A32"/>
    <stop offset="50%" stop-color="#4A9970"/>
    <stop offset="100%" stop-color="#1A4A32"/>
  </linearGradient>
</defs>

<!-- Background -->
<rect width="900" height="280" fill="url(#bg)"/>

<!-- === HEXAGONAL NETWORK (left side, like banner) === -->
