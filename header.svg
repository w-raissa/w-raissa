  <line x1="780" y1="40" x2="820" y2="65" stroke="#2D6A4F" stroke-width="0.5"><animate attributeName="opacity" values="0.05;0.3;0.05" dur="4s" begin="0.5s" repeatCount="indefinite"/></line>
  <line x1="820" y1="65" x2="850" y2="35" stroke="#2D6A4F" stroke-width="0.5"><animate attributeName="opacity" values="0.05;0.3;0.05" dur="3s" begin="1s" repeatCount="indefinite"/></line>
  <line x1="850" y1="35" x2="860" y2="90" stroke="#2D6A4F" stroke-width="0.5"><animate attributeName="opacity" values="0.05;0.3;0.05" dur="5s" begin="0.2s" repeatCount="indefinite"/></line>
