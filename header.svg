</g>

<!-- Thin horizontal rule line -->
<line x1="360" y1="228" x2="540" y2="228" stroke="url(#gl)" stroke-width="0.8" opacity="0.6">
  <animate attributeName="opacity" values="0;0.6" dur="1.5s" begin="1.5s" fill="freeze"/>
</line>

<!-- === TEXT === -->
<!-- Eyebrow label -->
<text x="450" y="85" text-anchor="middle"
  font-family="Courier New, monospace" font-size="10"
  letter-spacing="5" fill="#2D6A4F" opacity="0">
  COMPUTER ENGINEERING · YAOUNDÉ · CAMEROUN
  <animate attributeName="opacity" values="0;0.8" dur="1s" begin="0.5s" fill="freeze"/>
</text>

<!-- Name - serif elegant -->
<text x="450" y="148" text-anchor="middle"
  font-family="Georgia, Times New Roman, serif" font-size="58"
  font-weight="700" fill="#F0EBE0" opacity="0">
  Raïssa <tspan font-style="italic" fill="#4A9970">Wokmeni</tspan>
  <animate attributeName="opacity" values="0;1" dur="1.2s" begin="0.8s" fill="freeze"/>
</text>

<!-- Role -->
<text x="450" y="182" text-anchor="middle"
  font-family="Georgia, serif" font-size="14"
  font-style="italic" fill="#7A8C80" opacity="0">
  Engineer in the making · Solution Architect · Impact Builder
  <animate attributeName="opacity" values="0;1" dur="1s" begin="1.1s" fill="freeze"/>
</text>

<!-- Tagline -->
<text x="450" y="248" text-anchor="middle"
  font-family="Courier New, monospace" font-size="11"
  letter-spacing="6" fill="#1A4A32" opacity="0">
  ✦ LEARNING · BUILDING · LEADING ✦
  <animate attributeName="opacity" values="0;1" dur="1s" begin="1.4s" fill="freeze"/>
</text>
