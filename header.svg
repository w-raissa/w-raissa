  <circle cx="101" cy="116" r="2.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.9s" begin="1.5s" repeatCount="indefinite"/></circle>
  <circle cx="147" cy="140" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" begin="0.7s" repeatCount="indefinite"/></circle>
  <circle cx="193" cy="188" r="2.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" begin="1.1s" repeatCount="indefinite"/></circle>
  <circle cx="239" cy="164" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" begin="0.5s" repeatCount="indefinite"/></circle>
