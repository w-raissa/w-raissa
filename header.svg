  <polygon points="239,100 266,116 266,148 239,164 212,148 212,116"/>
  <polygon points="239,148 266,164 266,196 239,212 212,196 212,164"/>
  <polygon points="285,28 312,44 312,76 285,92 258,76 258,44"/>
  <polygon points="285,76 312,92 312,124 285,140 258,124 258,92"/>
  <polygon points="285,124 312,140 312,172 285,188 258,172 258,140"/>
</g>

<!-- Animated nodes on hex corners -->
<g fill="#4A9970">
