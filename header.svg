  <circle cx="101" cy="4" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" begin="0.4s" repeatCount="indefinite"/></circle>
  <circle cx="147" cy="28" r="2.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" begin="0.8s" repeatCount="indefinite"/></circle>
  <circle cx="82" cy="44" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" begin="0.2s" repeatCount="indefinite"/></circle>
  <circle cx="128" cy="20" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" begin="1s" repeatCount="indefinite"/></circle>
  <circle cx="55" cy="92" r="2.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" begin="0.6s" repeatCount="indefinite"/></circle>
